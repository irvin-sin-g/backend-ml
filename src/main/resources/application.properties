spring.application.name=mercaditolibre

# Base de datos MySQL en Colifly (ejemplo)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración global de CORS para React
spring.mvc.cors.allowed-origins=http://localhost:5173
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Configuración del Token JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Stripe keys (usa variables de entorno)
stripe.apikey.secret=${STRIPE_SECRET_KEY}
stripe.apikey.public=${STRIPE_PUBLIC_KEY}
